baseURL: https://iorit.github.io/
locale: zh-cn
title: iorit 的博客
theme: PaperMod

module:
  mounts:
    - source: archetypes
      target: archetypes
    - source: assets
      target: assets
    - source: content
      target: content
    - source: data
      target: data
    - source: i18n
      target: i18n
    - source: layouts
      target: layouts
    - source: static
      target: static
    - source: content/文章/image
      target: assets/image

enableRobotsTXT: true

params:
  mainSections: ["文章", "过往", "随笔"]

  # 评论区
  # 主用 Twikoo：填 envId 后启用（读者免登录，填个昵称就能发）
  #   envId 形如：https://你的站点名.netlify.app/.netlify/functions/twikoo
  # 备用 giscus：Twikoo 没配时才启用，需要 categoryId
  comments: true
  twikoo:
    envId: ""
    lang: zh-CN
    # 国内建议 npmmirror；换 CDN 时记得同步版本号
    js: "https://registry.npmmirror.com/twikoo/2.0.17/files/dist/twikoo.min.js"
  giscus:
    repo: iorit/iorit.github.io
    repoId: R_kgDOULiVXg
    category: ""
    categoryId: ""
    mapping: pathname
    strict: 0
    reactionsEnabled: 1
    inputPosition: top
    lang: zh-CN

  profileMode:
    enabled: false
  homeInfoParams:
    Title: "你好,我是 iorit 👋"
    Content: 欢迎来到我的博客,这里记录我的学习与生活。
  socialIcons:
    - name: github
      url: "https://github.com/iorit"
    - name: zhihu
      url: "https://www.zhihu.com/people/iorit"
    - name: bilibili
      url: "https://space.bilibili.com/474634110"
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  defaultTheme: auto

markup:
  # 代码块：用 class 输出（主题自带 chroma-styles.css 上色），没写语言的围栏自动猜
  highlight:
    noClasses: false
    guessSyntax: true
    lineNos: false
  goldmark:
    parser:
      attribute:
        block: true
        title: true
      wrapStandAloneImageWithinParagraph: false
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
            - - $
              - $
    renderer:
      unsafe: true

menu:
  main:
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: about
      name: 关于
      url: /about/
      weight: 30
    - identifier: tree
      name: 文件结构
      url: /tree/
      weight: 40
