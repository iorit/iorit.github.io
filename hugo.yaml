baseURL: https://iorit.github.io/
locale: zh-cn
title: iorit 的博客
theme: PaperMod

enableRobotsTXT: true

params:
  mainSections: ["posts"]
  profileMode:
    enabled: false
  homeInfoParams:
    Title: "你好,我是 iorit 👋"
    Content: 欢迎来到我的博客,这里记录我的学习与生活。
  socialIcons:
    - name: github
      url: "https://github.com/iorit"
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  defaultTheme: auto

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
          inline:
            - - \(
              - \)
    renderer:
      unsafe: true

menu:
  main:
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: about
      name: 关于
      url: /about/
      weight: 30
    - identifier: tree
      name: 文件结构
      url: /tree/
      weight: 40
